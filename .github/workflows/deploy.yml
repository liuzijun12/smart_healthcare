name: Deploy to Server

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:  # 支持手动触发

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: 开始部署
        run: echo "🚀 开始部署智能医疗系统..."
        
      - name: 通过 SSH 连接服务器并部署
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            set -e
            
            echo "=========================================="
            echo "  智能医疗系统 - 自动化部署"
            echo "=========================================="
            
            # 检查并修复 Docker Compose
            echo "🔍 检查 Docker Compose..."
            if ! docker-compose --version 2>/dev/null | grep -q "version"; then
              echo "⚠️  Docker Compose 损坏或不存在，正在修复..."
              
              # 删除损坏的文件
              sudo rm -f /usr/local/bin/docker-compose
              
              # 重新安装 Docker Compose
              echo "📥 下载 Docker Compose..."
              sudo curl -L "https://github.com/docker/compose/releases/download/v2.23.0/docker-compose-$(uname -s)-$(uname -m)" -o /usr/local/bin/docker-compose
              sudo chmod +x /usr/local/bin/docker-compose
              
              # 验证安装
              if docker-compose --version; then
                echo "✅ Docker Compose 安装成功"
              else
                echo "❌ Docker Compose 安装失败"
                exit 1
              fi
            else
              echo "✅ Docker Compose 正常"
            fi
            
            # 进入项目目录
            cd ${{ secrets.DEPLOY_PATH || '/data/lzj/smart_healthcare' }}
            
            # 拉取最新代码
            echo "📥 拉取最新代码..."
            git fetch --all
            git reset --hard origin/main || git reset --hard origin/master
            git pull origin main || git pull origin master
            
            # 检查并配置后端 .env 文件
            if [ ! -f backend/.env ]; then
              echo "⚠️  未找到 backend/.env 文件"
              if [ -f backend/example.env ]; then
                echo "📋 从 backend/example.env 复制配置..."
                cp backend/example.env backend/.env
                echo "✅ 已创建 backend/.env 文件"
                echo "⚠️  警告: 请确保已修改 backend/.env 中的敏感配置（数据库密码、密钥等）"
                echo "💡 提示: 可以使用以下命令编辑配置:"
                echo "   vim backend/.env"
              else
                echo "❌ 错误: backend/example.env 模板文件不存在"
                exit 1
              fi
            else
              echo "✅ 检测到 backend/.env 文件已存在，保留现有配置"
            fi
            
            # 停止现有容器（使用后端的 .env 文件）
            echo "⏸️  停止现有容器..."
            docker-compose -f docker/docker-compose.yaml --env-file backend/.env down
            
            # 清理未使用的镜像
            echo "🧹 清理未使用的镜像..."
            docker image prune -f
            
            # 重新构建并启动所有服务
            echo "🔨 构建镜像并启动服务..."
            docker-compose -f docker/docker-compose.yaml --env-file backend/.env up -d --build
            
            # 等待服务启动
            echo "⏳ 等待服务启动..."
            sleep 15
            
            # 检查服务状态
            echo "📊 检查服务状态..."
            docker-compose -f docker/docker-compose.yaml --env-file backend/.env ps
            
            echo ""
            echo "=========================================="
            echo "  ✅ 部署完成！"
            echo "=========================================="