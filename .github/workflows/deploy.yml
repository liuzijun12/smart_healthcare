name: Deploy to Server

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:  # 支持手动触发

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: 开始部署
        run: echo "🚀 开始部署智能医疗系统..."
        
      - name: 通过 SSH 连接服务器并部署
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            set -e
            
            echo "=========================================="
            echo "  智能医疗系统 - 自动化部署"
            echo "=========================================="
            
            # 检查 Docker Compose 版本
            echo "🔍 检查 Docker Compose..."
            if docker compose version &>/dev/null; then
              echo "✅ 使用 Docker Compose v2: $(docker compose version)"
              COMPOSE_CMD="docker compose"
            elif docker-compose --version &>/dev/null; then
              echo "✅ 使用 Docker Compose v1: $(docker-compose --version)"
              COMPOSE_CMD="docker-compose"
            else
              echo "❌ Docker Compose 未安装"
              exit 1
            fi
            
            # 进入项目目录
            cd ${{ secrets.DEPLOY_PATH || '/data/lzj/smart_healthcare' }}
            
            # 拉取最新代码
            echo "📥 拉取最新代码..."
            git fetch --all
            git reset --hard origin/main || git reset --hard origin/master
            git pull origin main || git pull origin master
            
            # 检查并配置后端 .env 文件
            if [ ! -f backend/.env ]; then
              echo "⚠️  未找到 backend/.env 文件"
              if [ -f backend/example.env ]; then
                echo "📋 从 backend/example.env 复制配置..."
                cp backend/example.env backend/.env
                echo "✅ 已创建 backend/.env 文件"
                echo ""
                echo "==========================================="
                echo "❌ 部署终止: 需要手动配置环境变量"
                echo "==========================================="
                echo ""
                echo "请按照以下步骤完成配置："
                echo ""
                echo "1. SSH 登录到服务器："
                echo "   ssh ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}"
                echo ""
                echo "2. 编辑配置文件："
                echo "   cd ${{ secrets.DEPLOY_PATH || '/data/lzj/smart_healthcare' }}"
                echo "   vim backend/.env"
                echo ""
                echo "3. 必须修改以下配置项："
                echo "   - MYSQL_ROOT_PASSWORD=<设置强密码>"
                echo "   - DB_PASSWORD=<设置数据库密码>"
                echo "   - SECRET_KEY=<生成Django密钥>"
                echo "   - MINIO_ROOT_PASSWORD=<设置MinIO密码>"
                echo "   - DEBUG=False (生产环境)"
                echo "   - ALLOWED_HOSTS=<你的域名或IP>"
                echo ""
                echo "4. 配置完成后，重新触发部署即可"
                echo ""
                exit 1
              else
                echo "❌ 错误: backend/example.env 模板文件不存在"
                exit 1
              fi
            else
              echo "✅ 检测到 backend/.env 文件已存在，保留现有配置"
            fi
            
            # 进入 docker 目录
            cd docker
            
            # 停止现有容器
            echo "⏸️  停止现有容器..."
            $COMPOSE_CMD down
            
            # 清理未使用的镜像
            echo "🧹 清理未使用的镜像..."
            docker image prune -f
            
            # 重新构建并启动所有服务
            echo "🔨 构建镜像并启动服务..."
            $COMPOSE_CMD up -d --build
            
            # 等待服务启动
            echo "⏳ 等待服务启动..."
            sleep 15
            
            # 检查服务状态
            echo "📊 检查服务状态..."
            $COMPOSE_CMD ps
            
            echo ""
            echo "=========================================="
            echo "  ✅ 部署完成！"
            echo "=========================================="